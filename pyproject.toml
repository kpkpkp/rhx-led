[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rhx-led"
version = "0.1.0"
description = "Drive RHX-series LED sign controllers (RHX8-Q1C) over Bluetooth LE: text, pictures, animations, pans, LAN service"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.21",
    "Pillow>=10.1",   # ImageFont.load_default(size)
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]

[project.optional-dependencies]
mdns = ["zeroconf>=0.130"]             # signd --mdns
video = ["opencv-python>=4.8", "numpy"]  # camera video analysis tools

[project.scripts]
signd = "signboard.signd:main"
rhx-sign = "signboard.direct:main"

[tool.setuptools]
packages = ["signboard"]

[tool.setuptools.package-data]
signboard = ["web/*.html", "templates/README.md"]
